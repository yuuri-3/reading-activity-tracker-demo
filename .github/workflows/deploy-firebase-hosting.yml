name: Deploy to Firebase (Hosting + Functions)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_TOOLS_VERSION: 15.3.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check lucide-react usage policy
        run: npm run check:lucide

      - name: Build
        env:
          VITE_BASE: /
          # Enable backend guest merge by default in production builds.
          # (Can be overridden via GitHub Actions Variables: VITE_ENABLE_BACKEND_GUEST_MERGE)
          VITE_ENABLE_BACKEND_GUEST_MERGE: ${{ vars.VITE_ENABLE_BACKEND_GUEST_MERGE || 'true' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run --prefix functions build

      - name: Write Firebase service account key
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "Missing secrets.FIREBASE_SERVICE_ACCOUNT" >&2
            exit 1
          fi
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"

      # Deploy Functions first so we never ship a new frontend that depends on old Functions.
      - name: Deploy Functions (live)
        run: npx firebase-tools@"$FIREBASE_TOOLS_VERSION" deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive

      - name: Deploy Hosting (live)
        run: npx firebase-tools@"$FIREBASE_TOOLS_VERSION" deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive
