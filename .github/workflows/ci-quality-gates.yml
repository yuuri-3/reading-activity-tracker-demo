name: CI Quality Gates (typecheck + test-storybook)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore_rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Setup Java (Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Firestore Rules tests (emulator)
        run: npx firebase-tools@15.3.1 emulators:exec --project yomzoy-rules-test --only firestore "npm run test:rules:unit"

  quality_gates:
    name: CI Quality Gates (typecheck + test-storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      VITE_FIREBASE_API_KEY: dummy
      VITE_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: dummy
      VITE_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: dummy
      VITE_FIREBASE_APP_ID: 1:123:web:abc
      VITE_FIREBASE_MEASUREMENT_ID: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check lucide-react usage policy
        run: npm run check:lucide

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Storybook
        run: |
          nohup npm run storybook -- --ci --host 127.0.0.1 --port 6006 > storybook.log 2>&1 &

      - name: Wait for Storybook
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:6006/iframe.html > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Storybook did not start in time" >&2
          echo "---- storybook.log (tail) ----" >&2
          tail -n 200 storybook.log >&2 || true
          exit 1

      - name: Storybook tests
        run: npm run test-storybook
